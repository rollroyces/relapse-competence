name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The revision-history check compares the report's table against the
          # commits that modified it, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest

      - name: Report consistency
        run: python scripts/verify_report_consistency.py

      - name: Audit findings disposition
        run: python scripts/audit_findings_disposition.py

      - name: Revision history
        run: python scripts/regenerate_revision_history.py --check

      - name: Application tracker
        run: python scripts/application_tracker.py --check

      - name: PLCO CDAS submission package
        run: |
          python scripts/check_plco_cdas_package.py
          python scripts/build_plco_cdas_pdf.py --check

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run benchmark
        run: |
          relapse-competence all --patients 800 --outdir results

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/benchmark_results.json
